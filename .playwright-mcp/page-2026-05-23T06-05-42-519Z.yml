                - text: "// Helper: poll payload status"
                - text: "function pollPayload(uuid, callbacks) {"
                - text: "const { onSigned, onExpired, onPending } = callbacks;"
                - text: "const interval = setInterval(async () => {"
                - text: "try {"
                - text: "const res = await fetch(`${API_BASE}/api/payload/${uuid}`);"
                - text: const data = await res.json();
                - text: "if (data.signed) {"
                - text: clearInterval(interval);
                - text: onSigned(data);
                - text: "} else if (data.expired) {"
                - text: clearInterval(interval);
                - text: onExpired(data);
                - text: "} else {"
                - text: if (onPending) onPending();
                - text: "}"
                - text: "} catch (err) {"
                - text: // silently retry
                - text: "}"
                - text: "}, 1500); // poll every 1.5s"
                - text: return interval;

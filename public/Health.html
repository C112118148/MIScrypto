<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Health Dashboard</title>
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-box: #f8fafc;
            --border-light: #f1f5f9;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --status-bg: #ecfdf5;
            --status-text: #059669;
            --status-dot: #10b981;
            /* 新增錯誤狀態的顏色 */
            --error-bg: #fef2f2;
            --error-text: #dc2626;
            --error-dot: #ef4444;
            --error-border: #fecaca;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .health-card {
            background-color: var(--bg-card);
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-light);
            overflow: hidden;
        }

        .card-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-light);
            background-color: var(--bg-box);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-header h1 { font-size: 18px; font-weight: 600; color: var(--text-main); }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--status-bg);
            color: var(--status-text);
            padding: 6px 12px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid #d1fae5;
            transition: all 0.3s ease;
        }

        /* 錯誤狀態的樣式切換 */
        .status-badge.error {
            background-color: var(--error-bg);
            color: var(--error-text);
            border-color: var(--error-border);
        }

        .dot-wrapper { position: relative; width: 10px; height: 10px; }
        .dot {
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            background-color: var(--status-dot);
            transition: background-color 0.3s ease;
        }
        .status-badge.error .dot { background-color: var(--error-dot); }

        .dot.ping {
            animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
            opacity: 0.75;
        }
        /* 若發生錯誤則停止呼吸燈 */
        .status-badge.error .dot.ping { display: none; }

        @keyframes ping {
            75%, 100% { transform: scale(2.5); opacity: 0; }
        }

        .card-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .data-box {
            background-color: var(--bg-box);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 16px;
        }
        .data-label {
            font-size: 11px; font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;
        }
        .data-value { font-size: 16px; font-weight: 600; color: var(--text-main); }
        .data-value.large { font-size: 24px; }
        .data-value.mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 14px; word-break: break-all;
            background-color: var(--bg-card);
            padding: 10px; border: 1px solid var(--border-light);
            border-radius: 8px; margin-top: 4px;
        }

        /* 載入中的骨架屏效果 (可選) */
        .loading { opacity: 0.5; }
    </style>
</head>
<body>

    <div class="health-card">
        <div class="card-header">
            <h1>System Health</h1>
            <div id="status-badge" class="status-badge">
                <div class="dot-wrapper">
                    <div id="dot-ping" class="dot ping"></div>
                    <div class="dot"></div>
                </div>
                <span id="health-status">載入中...</span>
            </div>
        </div>

        <div class="card-body">
            <div class="grid-layout">
                <div class="data-box">
                    <div class="data-label">Network</div>
                    <div id="health-network" class="data-value loading">--</div>
                </div>
                <div class="data-box">
                    <div class="data-label">Tracked Items</div>
                    <div id="health-tracked" class="data-value large loading">-</div>
                </div>
            </div>

            <div class="data-box">
                <div class="data-label">Logistics Address</div>
                <div id="health-address" class="data-value mono loading">正在獲取資料...</div>
            </div>
        </div>
    </div>

    <!-- 參考你提供的 app.js 概念，實作對應的 JS 邏輯 -->
    <script>
        // 輔助函式 (同你的 app.js)
        const $ = id => document.getElementById(id);

        async function checkApiHealth() {
            try {
                // 加上 headers 明確要求伺服器給 application/json
                const response = await fetch('/api/health', {
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('API 無法連線');
                }

                const data = await response.json();

                // 移除載入中的半透明效果
                $('health-network').classList.remove('loading');
                $('health-tracked').classList.remove('loading');
                $('health-address').classList.remove('loading');

                // 填入資料
                $('health-network').textContent = data.network || '未知';
                $('health-tracked').textContent = data.trackedItems !== undefined ? data.trackedItems : '0';
                $('health-address').textContent = data.logisticsAddress || '無資料';

                // 判斷狀態並更新 UI
                if (data.status === 'ok') {
                    $('status-badge').classList.remove('error');
                    $('health-status').textContent = 'OK';
                } else {
                    $('status-badge').classList.add('error');
                    $('health-status').textContent = data.status ? data.status.toUpperCase() : 'ERROR';
                }

            } catch (error) {
                console.error('Fetch health data failed:', error);

                // 發生錯誤時的 UI 處理
                $('status-badge').classList.add('error');
                $('health-status').textContent = 'ERROR';
                $('health-network').textContent = '連線失敗';
                $('health-tracked').textContent = '-';
                $('health-address').textContent = '無法取得地址';
            }
        }

        // 頁面載入時立刻獲取一次資料
        checkApiHealth();

        // (可選) 每 10 秒自動刷新一次資料
        // setInterval(checkApiHealth, 10000);
    </script>
</body>
</html>

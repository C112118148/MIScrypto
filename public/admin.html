<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>物流管理 - 雞蛋產銷履歷</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: #f0f4f0; color: #222; line-height: 1.6;
    }
    .container { max-width: 640px; margin: 0 auto; padding: 16px; }

    header {
      background: linear-gradient(135deg, #1565C0, #1E88E5);
      color: #fff; padding: 28px 20px 20px; text-align: center;
      border-radius: 0 0 24px 24px; margin-bottom: 20px;
    }
    header h1 { font-size: 1.5rem; }
    header p  { font-size: .85rem; opacity: .85; }

    .card {
      background: #fff; border-radius: 14px; padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07); margin-bottom: 16px;
    }
    .card-title {
      font-size: 1rem; font-weight: 700; margin-bottom: 14px; color: #333;
    }

    /* 登入 */
    .login-section { text-align: center; padding: 20px 0; }
    .login-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px 32px; background: #1565C0; color: #fff;
      border: none; border-radius: 12px; font-size: 1rem; cursor: pointer;
      transition: background .2s;
    }
    .login-btn:hover { background: #0D47A1; }
    .login-btn:disabled { opacity: .5; cursor: not-allowed; }

    /* QR */
    .qr-area { display: none; text-align: center; padding: 12px 0; }
    .qr-wrapper { display: inline-block; padding: 16px; background: #fff; border-radius: 12px; }
    .qr-img { width: 220px; height: 220px; image-rendering: pixelated; }
    .qr-hint { margin-top: 10px; font-size: .9rem; color: #666; }
    .qr-link  { display: inline-block; margin-top: 6px; font-size: .85rem; color: #1565C0; }
    .qr-uuid  { margin-top: 6px; font-size: .75rem; color: #aaa; font-family: monospace; }

    /* 使用者資訊 */
    .user-info { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
    .user-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: #e3f2fd; display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
    }
    .user-address { font-family: monospace; font-size: .85rem; color: #666; word-break: break-all; }

    /* 表單 */
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 8px; color: #444; }
    .form-group input, .form-group select {
      width: 100%; padding: 12px; border: 2px solid #ddd;
      border-radius: 8px; font-size: 1rem; outline: none; transition: border-color .2s;
    }
    .form-group input:focus, .form-group select:focus { border-color: #1E88E5; }

    /* 掃描輸入區塊 - 桌面版排版 */
    .input-with-btn { display: flex; gap: 8px; }
    .input-with-btn input { flex: 1; }
    .action-btn {
      padding: 12px 20px; background: #E3F2FD; color: #1565C0;
      border: 2px solid #BBDEFB; border-radius: 8px; cursor: pointer; white-space: nowrap;
      font-weight: 600; font-size: 1rem; display: flex; align-items: center; gap: 6px; transition: all 0.2s;
    }
    .action-btn:hover { background: #BBDEFB; }

    /* 正在掃描時的按鈕狀態 */
    .action-btn.scanning {
      background: #ffebee; color: #c62828; border-color: #ffcdd2;
    }

    .submit-btn {
      width: 100%; padding: 14px; background: #2E7D32; color: #fff;
      border: none; border-radius: 10px; font-size: 1.1rem; cursor: pointer;
      transition: background .2s; font-weight: 600;
    }
    .submit-btn:hover { background: #1B5E20; }
    .submit-btn:disabled { background: #9E9E9E; cursor: not-allowed; }

    /* 訊息與歷史 */
    .success-msg { padding: 14px; background: #e8f5e9; border-radius: 10px; border: 1px solid #c8e6c9; margin-top: 12px; }
    .error-msg { padding: 14px; background: #ffebee; border-radius: 10px; border: 1px solid #ffcdd2; color: #c62828; margin-top: 12px; }
    .info-msg { font-size: 0.9rem; color: #1565C0; margin-top: 8px; display: block; line-height: 1.4; }

    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f0f0; font-size: .9rem; }
    .history-item:last-child { border-bottom: none; }
    .history-item .h-status { font-weight: 600; }
    .history-item .h-time  { color: #888; font-size: 0.8rem; }
    .tx-link { color: #1565C0; text-decoration: none; font-family: monospace; font-size: .8rem; }
    .tx-link:hover { text-decoration: underline; }
    .hidden { display: none !important; }

    /* ========================================================
       ✨ Html5QrcodeScanner 掃描器介面深度美化
       ======================================================== */
    #reader {
      width: 100%; border-radius: 12px; overflow: hidden; margin-top: 12px;
      display: none; border: 2px dashed #1E88E5 !important; background: #fafafa;
    }
    /* 隱藏預設醜標籤 */
    #reader__dashboard_section_csr span { font-size: 0.9rem !important; color: #555 !important; }
    /* 美化內部按鈕 */
    #reader button {
      background-color: #1565C0 !important; color: #fff !important;
      border: none !important; padding: 10px 20px !important;
      border-radius: 8px !important; font-size: 1rem !important;
      font-weight: 600 !important; cursor: pointer; margin: 8px !important;
    }
    #reader__scan_region video {
      border-radius: 10px !important; object-fit: cover;
    }
    #reader a { color: #1E88E5 !important; text-decoration: none !important; }
    #reader__dashboard_section_swaplink { display: none !important; }

    /* ========================================================
       📱 手機版排版優化 (Mobile First)
       ======================================================== */
    @media (max-width: 480px) {
      .input-with-btn {
        flex-direction: column; /* 將輸入框和按鈕改為上下排列 */
      }
      .input-with-btn input {
        width: 100%; font-size: 1.1rem; padding: 14px;
      }
      .action-btn {
        width: 100%; justify-content: center; padding: 14px; font-size: 1.1rem;
      }
    }

    /* 列印專用 CSS */
    @media print {
      body * { visibility: hidden; }
      #printWrapper, #printWrapper * { visibility: visible; }
      #printWrapper {
        position: absolute; left: 0; top: 0; width: 100%; height: 100%;
        display: flex !important; flex-direction: column; align-items: center; justify-content: center;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>
  <header class="no-print">
    <h1>📋 物流管理系統</h1>
    <p>使用 Xaman 錢包登入以更新區塊鏈狀態</p>
  </header>

  <div class="container no-print">
    <div class="card" id="loginCard">
      <div class="card-title">🔐 身分驗證</div>
      <div class="login-section" id="loginSection">
        <button class="login-btn" id="loginBtn">📱 使用 Xaman 錢包登入</button>
      </div>
      <div class="qr-area" id="authQR"></div>
    </div>

    <div id="adminSection" class="hidden">
      <div class="card">
        <div class="card-title">👤 物流人員</div>
        <div class="user-info">
          <div class="user-avatar" id="userAvatar">🧑‍🌾</div>
          <div>
            <div style="font-weight:600">已連線 Xaman</div>
            <div class="user-address" id="userAddress">—</div>
            <div id="userRoleBadge" style="font-size:.85rem;margin-top:2px"></div>
          </div>
          <button id="logoutBtn" style="margin-left:auto;padding:8px 16px;background:#eee;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600;">登出</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">📤 更新物流狀態</div>
        <form id="updateForm" autocomplete="off">
          <div class="form-group">
            <label for="itemId">商品 ID</label>
            <div class="input-with-btn">
              <input type="text" id="itemId" placeholder="手動輸入，或使用下方按鈕掃描" required />
              <button type="button" class="action-btn" id="scanBtn">📷 掃描條碼</button>
            </div>

            <!-- 掃描畫面容器 -->
            <div id="reader"></div>

            <span id="statusHint" class="info-msg"></span>
          </div>

          <div class="form-group" id="statusGroup">
            <label for="status">狀態 (依序更新)</label>
            <select id="status" disabled>
              <option value="">-- 請先輸入或掃描商品 ID --</option>
              <option value="produced">📦 生產完成 (🏭 製造商)</option>
              <option value="shipped">🚚 運送中 (🚚 物流中心)</option>
              <option value="sold">🏪 已上架銷售 (🏪 零售商)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="location">地點 (選填)</label>
            <input type="text" id="location" placeholder="例如 台北養雞場" />
          </div>

          <div id="signerHelp" style="font-size:.85rem;color:#888;margin-bottom:12px"></div>
          <button type="submit" class="submit-btn" id="updateBtn" disabled>✍️ 簽署並寫入 XRPL</button>
        </form>

        <div class="qr-area" id="updateQR"></div>
        <div id="updateResult"></div>
      </div>

      <div class="card">
        <div class="card-title">🖨️ 商品 QR 標籤列印</div>
        <div class="form-group">
          <label>產生商品 ID 的 QR Code</label>
          <div class="input-with-btn">
            <input type="text" id="printInputId" placeholder="例如 EGG001" />
            <button type="button" class="action-btn" id="generatePrintBtn" style="background:#f0f0f0;color:#333;border-color:#ccc;">產生</button>
          </div>
        </div>
        <div id="printPreview" class="hidden" style="text-align: center; padding: 16px; background: #fafafa; border-radius: 8px; border: 1px dashed #ccc; margin-top: 10px;">
          <div id="qrCodeCanvas" style="display:inline-block; margin-bottom: 10px;"></div>
          <div id="qrCodeLabel" style="font-weight: bold; font-size: 1.4rem; font-family: monospace; letter-spacing: 2px;"></div>
          <button type="button" class="login-btn" id="triggerPrintBtn" style="width: 100%; margin-top: 12px;">🖨️ 列印此標籤</button>
        </div>
      </div>

      <div class="card" id="historyCard">
        <div class="card-title">📜 本次登入更新記錄</div>
        <div id="historyList">
          <div style="text-align:center;color:#aaa;padding:10px">尚無更新紀錄</div>
        </div>
      </div>
    </div>
  </div>

  <div id="printWrapper" class="hidden">
    <div id="printTarget" style="text-align:center;"></div>
    <div id="printTargetLabel" style="font-weight:bold; font-size: 32px; font-family: monospace; margin-top: 15px; letter-spacing: 2px;"></div>
  </div>

  <script src="app.js"></script>
  <script>
    // ── 變數與狀態 ──────────────────────────────────────────
    let isLoggedIn = false;
    let userXRPLAddress = '';
    let userRole = '';
    let userRoleLabel = '';
    let allowedStatuses = [];
    let rolesConfig = {};
    let pollingInterval = null;
    let history = [];
    let html5QrcodeScanner = null;

    const NEXT_STATUS_MAP = {
      'unknown': 'produced',
      'produced': 'shipped',
      'shipped': 'sold',
      'sold': null
    };

    // ── DOM 元件 ──────────────────────────────────────────
    const loginCard     = $('loginCard');
    const loginSection  = $('loginSection');
    const loginBtn      = $('loginBtn');
    const authQR        = $('authQR');
    const adminSection  = $('adminSection');
    const userAddress   = $('userAddress');
    const userRoleBadge = $('userRoleBadge');
    const logoutBtn     = $('logoutBtn');

    const updateForm    = $('updateForm');
    const updateBtn     = $('updateBtn');
    const updateQR      = $('updateQR');
    const updateResult  = $('updateResult');
    const historyList   = $('historyList');

    const itemIdInput   = $('itemId');
    const statusSelect  = $('status');
    const statusHint    = $('statusHint');
    const signerHelp    = $('signerHelp');

    const scanBtn       = $('scanBtn');
    const readerDiv     = $('reader');

    const printInputId     = $('printInputId');
    const generatePrintBtn = $('generatePrintBtn');
    const printPreview     = $('printPreview');
    const triggerPrintBtn  = $('triggerPrintBtn');

    // ── 啟動載入 ──────────────────────────────────────────
    (async () => {
      try { rolesConfig = (await api('GET', '/api/roles')).roles; } catch {}
    })();

    // ── 登入流程 ──────────────────────────────────────────
    loginBtn.addEventListener('click', async () => {
      loginBtn.disabled = true; loginBtn.textContent = '⏳ 產生登入請求中…';
      try {
        const data = await api('POST', '/api/auth');
        showQR('authQR', data);
        loginSection.style.display = 'none';

        pollingInterval = pollPayload(data.uuid, {
          onSigned: (res) => {
            hideQR('authQR');
            onLoginSuccess(res.account);
          },
          onExpired: () => {
            hideQR('authQR'); loginSection.style.display = 'block';
            loginBtn.disabled = false; loginBtn.textContent = '📱 使用 Xaman 錢包登入';
            alert('⚠️ 登入逾時，請重新嘗試');
          }
        });
      } catch (err) {
        loginBtn.disabled = false; loginBtn.textContent = '📱 使用 Xaman 錢包登入';
        alert('❌ ' + err.message);
      }
    });

    function onLoginSuccess(account) {
      isLoggedIn = true; userXRPLAddress = account;
      userAddress.textContent = `XRPL 地址: ${account}`;

      userRole = ''; userRoleLabel = ''; allowedStatuses = ['produced', 'shipped', 'sold'];
      const badge = $('userRoleBadge'), avatar = $('userAvatar');

      for (const [role, cfg] of Object.entries(rolesConfig)) {
        if (cfg.configured && cfg.addresses && cfg.addresses.includes(account)) {
          userRole = role; userRoleLabel = cfg.label;
          allowedStatuses = [role === 'manufacturer' ? 'produced' : role === 'logistics' ? 'shipped' : 'sold'];
          badge.innerHTML = `✅ ${cfg.emoji} ${cfg.label}`; badge.style.color = '#2E7D32';
          avatar.textContent = cfg.emoji;
          break;
        }
      }
      if (!userRole) {
        if (Object.values(rolesConfig).some(c => c.configured)) {
          badge.innerHTML = '⚠️ 未綁定角色，無法更新'; badge.style.color = '#c62828'; allowedStatuses = [];
        } else {
          badge.innerHTML = '🔓 無限制測試模式'; badge.style.color = '#888';
        }
      }

      signerHelp.textContent = userRole ? `您正以 ${ROLE_EMOJI[userRole]||''} ${userRoleLabel} 身分操作` : (allowedStatuses.length ? '💰 可簽署所有步驟' : '⚠️ 無權限');

      loginCard.style.display = 'none'; adminSection.classList.remove('hidden');
    }

    // ── 登出 ──────────────────────────────────────────────
    logoutBtn.addEventListener('click', () => {
      isLoggedIn = false; adminSection.classList.add('hidden');
      loginCard.style.display = 'block'; loginSection.style.display = 'block';
      loginBtn.disabled = false; loginBtn.textContent = '📱 使用 Xaman 錢包登入';
      if (html5QrcodeScanner) { html5QrcodeScanner.clear(); readerDiv.style.display = 'none'; }
    });

    // ── 掃描器功能 (手機優化版) ───────────────────────────
    scanBtn.addEventListener('click', () => {
      if (readerDiv.style.display === 'block') {
        if (html5QrcodeScanner) html5QrcodeScanner.clear();
        readerDiv.style.display = 'none';
        scanBtn.textContent = '📷 掃描條碼';
        scanBtn.classList.remove('scanning');
        return;
      }

      readerDiv.style.display = 'block';
      scanBtn.textContent = '❌ 取消掃描';
      scanBtn.classList.add('scanning');

      // 動態計算掃描框大小 (佔畫面 70%)
      const qrboxFunction = function(viewfinderWidth, viewfinderHeight) {
          let minEdgeSize = Math.min(viewfinderWidth, viewfinderHeight);
          let qrboxSize = Math.floor(minEdgeSize * 0.7);
          return { width: qrboxSize, height: qrboxSize };
      }

      html5QrcodeScanner = new Html5QrcodeScanner("reader", {
        fps: 10,
        qrbox: qrboxFunction,
        // 強制優先使用手機的後置鏡頭
        videoConstraints: { facingMode: "environment" }
      }, false);

      html5QrcodeScanner.render((decodedText) => {
        itemIdInput.value = decodedText;
        html5QrcodeScanner.clear();
        readerDiv.style.display = 'none';
        scanBtn.textContent = '📷 掃描條碼';
        scanBtn.classList.remove('scanning');

        validateItemState(decodedText);
      }, (error) => {});
    });

    // ── 實體掃描槍支援 (攔截 Enter) ───────────────────────
    itemIdInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        validateItemState(e.target.value);
      }
    });

    itemIdInput.addEventListener('blur', (e) => validateItemState(e.target.value));

    async function validateItemState(itemId) {
      itemId = itemId.trim();
      if (!itemId) {
        statusSelect.disabled = true; updateBtn.disabled = true;
        statusHint.textContent = ''; return;
      }

      statusHint.innerHTML = '🔄 <span style="color:#1565C0">查詢鏈上狀態中...</span>';
      statusSelect.disabled = true;
      updateBtn.disabled = true;

      try {
        const res = await api('GET', `/api/logistics/${itemId}`);
        const currentStatus = res.currentStatus;
        const nextRequiredStatus = NEXT_STATUS_MAP[currentStatus];

        if (!nextRequiredStatus) {
          statusHint.innerHTML = '✅ <span style="color:#2E7D32; font-weight:bold;">此商品已完成所有物流階段 (已上架)。</span>';
          statusSelect.innerHTML = '<option>已結束</option>';
          return;
        }

        statusSelect.innerHTML = `
          <option value="${nextRequiredStatus}" selected>
            ${STATUS_LABELS[nextRequiredStatus]}
          </option>
        `;

        statusHint.innerHTML = `ℹ️ 目前狀態：<b>${currentStatus === 'unknown' ? '尚未生產' : STATUS_LABELS[currentStatus]}</b>。只能進入下一步驟。`;

        if (allowedStatuses.length === 0 || !allowedStatuses.includes(nextRequiredStatus)) {
          statusHint.innerHTML += `<br/><span style="color:#c62828; font-weight:bold;">⚠️ 您目前的角色無法執行此階段的更新。</span>`;
        } else {
          statusSelect.disabled = false;
          updateBtn.disabled = false;
        }

      } catch (err) {
        statusHint.innerHTML = '<span style="color:#c62828;">❌ 查詢失敗，請確認網路或 API。</span>';
      }
    }

    // ── 列印 QR Code 功能 ──────────────────────────────────
    generatePrintBtn.addEventListener('click', () => {
      const id = printInputId.value.trim();
      if (!id) { alert('請輸入要列印的商品 ID'); return; }

      $('qrCodeLabel').textContent = id;
      $('printTargetLabel').textContent = id;

      const canvas1 = $('qrCodeCanvas');
      const canvas2 = $('printTarget');
      canvas1.innerHTML = ''; canvas2.innerHTML = '';

      new QRCode(canvas1, { text: id, width: 160, height: 160 });
      new QRCode(canvas2, { text: id, width: 350, height: 350 });

      printPreview.classList.remove('hidden');
    });

    triggerPrintBtn.addEventListener('click', () => {
      window.print();
    });

    // ── 提交更新 ──────────────────────────────────────────
    updateForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!isLoggedIn) return;

      const itemId = itemIdInput.value.trim();
      const status = statusSelect.value;
      const location = $('location').value.trim();

      updateBtn.disabled = true; updateBtn.textContent = '⏳ 建立 Payload…';
      updateResult.innerHTML = '';

      try {
        const data = await api('POST', '/api/logistics/update', { itemId, status, location, signerAddress: userXRPLAddress });
        showQR('updateQR', data);
        updateBtn.textContent = '⌛ 等待簽名…';

        pollingInterval = pollPayload(data.uuid, {
          onSigned: (res) => {
            hideQR('updateQR');
            updateBtn.disabled = true;
            updateBtn.textContent = '✍️ 簽署並寫入 XRPL';
            updateResult.innerHTML = `<div class="success-msg">✅ 更新成功！<br/>🔗 ${xrplLink(res.txHash, '檢視交易')}</div>`;
            history.unshift({ itemId, status, txHash: res.txHash, time: new Date().toISOString() });
            renderHistory();
            itemIdInput.value = '';
            statusHint.textContent = '';
          },
          onExpired: () => {
            hideQR('updateQR'); updateBtn.disabled = false; updateBtn.textContent = '✍️ 簽署並寫入 XRPL';
            updateResult.innerHTML = '<div class="error-msg">⚠️ 簽署逾時</div>';
          }
        });
      } catch (err) {
        updateBtn.disabled = false; updateBtn.textContent = '✍️ 簽署並寫入 XRPL';
        updateResult.innerHTML = `<div class="error-msg">❌ ${err.message}</div>`;
      }
    });

    function renderHistory() {
      if (!history.length) return;
      historyList.innerHTML = history.map(h => `
        <div class="history-item">
          <div>
            <span class="h-status" style="color:${STATUS_COLORS[h.status]||'#333'}">${STATUS_LABELS[h.status]||h.status}</span>
            <span style="color:#888;margin-left:8px;font-weight:600;">${h.itemId}</span>
          </div>
          <div style="text-align:right">
            <div class="h-time">${formatDate(h.time)}</div>
            <div style="margin-top:4px;">${xrplLink(h.txHash, '🔗 交易')}</div>
          </div>
        </div>`).join('');
    }
  </script>
</body>
</html>

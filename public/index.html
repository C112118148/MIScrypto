<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🥚 雞蛋產銷履歷 - 區塊鏈溯源</title>

  <!-- 引入 QR Code 掃描套件 -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: #f0f4f0; color: #222; line-height: 1.6;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 16px; }

    /* Header */
    header {
      background: linear-gradient(135deg, #2E7D32, #43A047);
      color: #fff; padding: 28px 20px 20px; text-align: center;
      border-radius: 0 0 24px 24px; margin-bottom: 20px;
    }
    header h1 { font-size: 1.6rem; margin-bottom: 4px; }
    header p  { font-size: 0.9rem; opacity: .85; }

    /* Card */
    .card {
      background: #fff; border-radius: 14px; padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07); margin-bottom: 16px;
    }

    /* Item Search */
    .search-row {
      display: flex; gap: 10px;
    }
    .search-row input {
      flex: 1; padding: 12px 14px; border: 2px solid #ddd;
      border-radius: 10px; font-size: 1rem; outline: none;
      transition: border-color .2s;
    }
    .search-row input:focus { border-color: #43A047; }

    .btn-primary {
      padding: 12px 24px; background: #2E7D32; color: #fff;
      border: none; border-radius: 10px; font-size: 1rem; cursor: pointer;
      transition: background .2s; white-space: nowrap; font-weight: 600;
    }
    .btn-primary:hover { background: #1B5E20; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

    .btn-scan {
      padding: 12px 16px; background: #E8F5E9; color: #2E7D32;
      border: 2px solid #C8E6C9; border-radius: 10px; font-size: 1rem; cursor: pointer;
      transition: all .2s; white-space: nowrap; font-weight: 600;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-scan:hover { background: #C8E6C9; }
    .btn-scan.scanning { background: #ffebee; color: #c62828; border-color: #ffcdd2; }

    /* Status Badge */
    .status-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; background: #f9fdf9; border-radius: 10px;
      border: 1px solid #e0f0e0; flex-wrap: wrap;
    }
    .status-item-id { font-weight: 700; font-size: 1.1rem; }
    .status-badge {
      display: inline-block; padding: 4px 14px; border-radius: 20px;
      font-size: .85rem; font-weight: 600; color: #fff; margin-left: auto;
    }

    /* Loading */
    .loading { text-align: center; padding: 40px 0; color: #888; }
    .spinner {
      display: inline-block; width: 36px; height: 36px;
      border: 3px solid #e0e0e0; border-top-color: #43A047;
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Empty / Error */
    .empty-state { text-align: center; padding: 40px 0; color: #999; font-size: 1.1rem; }
    .error-state { text-align: center; padding: 20px; color: #c62828; background: #ffebee; border-radius: 10px; }

    /* ── Timeline ────────────────────────────────── */
    .timeline { position: relative; padding-left: 32px; }
    .timeline::before {
      content: ''; position: absolute; left: 14px; top: 6px; bottom: 6px;
      width: 2px; background: #e0e0e0;
    }
    .tl-event { position: relative; margin-bottom: 24px; }
    .tl-event:last-child { margin-bottom: 0; }
    .tl-dot {
      position: absolute; left: -22px; top: 6px;
      width: 14px; height: 14px; border-radius: 50%;
      background: #ccc; border: 3px solid #ccc;
      transition: all .3s;
    }
    .tl-event.active .tl-dot {
      width: 18px; height: 18px; left: -24px; top: 4px;
      box-shadow: 0 0 0 4px rgba(76,175,80,.15);
    }
    .tl-card {
      background: #f9f9f9; border-radius: 10px; padding: 14px 16px;
      border: 1px solid #eee; transition: border-color .2s;
    }
    .tl-event.active .tl-card { border-color: #c8e6c9; background: #fafffa; }
    .tl-status  { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
    .tl-meta    { display: flex; flex-wrap: wrap; gap: 10px; font-size: .85rem; color: #666; margin-bottom: 6px; }
    .tl-footer  { display: flex; justify-content: space-between; align-items: center; font-size: .8rem; color: #999; }
    .tl-handler { font-family: monospace; }
    .tx-link    { color: #1565C0; text-decoration: none; }
    .tx-link:hover { text-decoration: underline; }

    /* ========================================================
       ✨ Html5QrcodeScanner 掃描器介面深度美化
       ======================================================== */
    #reader {
      width: 100%; border-radius: 12px; overflow: hidden; margin-top: 12px;
      display: none; border: 2px dashed #43A047 !important; background: #fafafa;
    }
    #reader__dashboard_section_csr span { font-size: 0.9rem !important; color: #555 !important; }
    #reader button {
      background-color: #2E7D32 !important; color: #fff !important;
      border: none !important; padding: 10px 20px !important;
      border-radius: 8px !important; font-size: 1rem !important;
      font-weight: 600 !important; cursor: pointer; margin: 8px !important;
    }
    #reader__scan_region video { border-radius: 10px !important; object-fit: cover; }
    #reader a { color: #43A047 !important; text-decoration: none !important; }
    #reader__dashboard_section_swaplink { display: none !important; }
.detail-btn {
      background: none; border: none; color: #1565C0; font-size: .85rem;
      cursor: pointer; font-weight: 600; padding: 4px 8px; border-radius: 6px;
      transition: background 0.2s;
    }
    .detail-btn:hover { background: #e3f2fd; }

    .tx-detail-box {
      margin-top: 12px; padding: 14px; background: #222; color: #4ade80;
      border-radius: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      font-size: 0.8rem; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }
    .tx-detail-row { margin-bottom: 8px; word-break: break-all; }
    .tx-detail-row:last-child { margin-bottom: 0; }
    .tx-label { color: #a1a1aa; display: inline-block; width: 100px; font-weight: bold; }
    .tx-explorer-link {
      display: inline-block; margin-top: 10px; color: #60a5fa; text-decoration: none;
      border: 1px solid #3b82f6; padding: 4px 10px; border-radius: 6px; transition: all 0.2s;
    }
    .tx-explorer-link:hover { background: #3b82f6; color: #fff; }

    /* Responsive */
    @media (max-width: 480px) {
      header h1 { font-size: 1.3rem; }
      .search-row { flex-direction: column; }
      .search-row button { width: 100%; justify-content: center; }
      .status-badge { margin-left: 0; margin-top: 6px; width: fit-content; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🥚 雞蛋產銷履歷</h1>
    <p>區塊鏈 x 食品安全 — 每筆紀錄都不可篡改</p>
  </header>

  <div class="container">
    <!-- 搜尋區塊 -->
    <div class="card">
      <div class="search-row">
        <input type="text" id="itemInput" placeholder="輸入商品 ID，例如 EGG001" />
        <button id="scanBtn" class="btn-scan">📷 掃描</button>
        <button id="searchBtn" class="btn-primary">🔍 查詢</button>
      </div>
      <!-- 掃描畫面容器 -->
      <div id="reader"></div>
    </div>

    <!-- 狀態列 -->
    <div class="card status-bar" id="statusBar" style="display:none">
      <span class="status-item-id" id="itemIdDisplay"></span>
      <span style="font-size:.85rem;color:#888;margin-left:8px;" id="eventCount"></span>
      <span class="status-badge" id="statusBadge"></span>
    </div>

    <!-- 載入中 -->
    <div class="card loading" id="loading" style="display:none">
      <div class="spinner"></div>
      <p style="margin-top:12px">正在從 XRPL 查詢資料…</p>
    </div>

    <!-- 錯誤 -->
    <div id="errorMsg" style="display:none"></div>

    <!-- 時間軸 -->
    <div class="card" id="resultCard" style="display:none">
      <h3 style="margin-bottom:16px;font-size:1rem;color:#555">📋 物流時間軸</h3>
      <div id="timeline"></div>
    </div>

    <!-- 初次提示 -->
    <div class="card" id="welcome">
      <div style="text-align:center;padding:30px 0;color:#888">
        <p style="font-size:2.5rem;margin-bottom:10px">🥚</p>
        <p>點擊上方「掃描」讀取包裝 QR Code</p>
        <p style="font-size:.85rem;margin-top:6px">或手動輸入商品 ID 查詢履歷</p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // ── 變數宣告 (必須在最上方初始化) ────────────────────────
    let html5QrcodeScanner = null;
    const scanBtn = $('scanBtn');
    const readerDiv = $('reader');

    // ── 事件綁定 ────────────────────────────────────────
    $('searchBtn').addEventListener('click', () => {
      const val = $('itemInput').value.trim();
      if (val) queryItem(val);
    });

    // 支援實體掃描槍 (攔截 Enter)
    $('itemInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        $('searchBtn').click();
      }
    });

    // ── 掃描器邏輯 (消費者版本) ──────────────────────────
    scanBtn.addEventListener('click', () => {
      // 如果正在掃描中，則關閉
      if (readerDiv.style.display === 'block') {
        if (html5QrcodeScanner) html5QrcodeScanner.clear();
        readerDiv.style.display = 'none';
        scanBtn.innerHTML = '📷 掃描';
        scanBtn.classList.remove('scanning');
        return;
      }

      // 開啟掃描介面
      readerDiv.style.display = 'block';
      scanBtn.innerHTML = '❌ 取消掃描';
      scanBtn.classList.add('scanning');

      // 隱藏歡迎畫面
      $('welcome').style.display = 'none';

      const qrboxFunction = function(viewfinderWidth, viewfinderHeight) {
          let minEdgeSize = Math.min(viewfinderWidth, viewfinderHeight);
          let qrboxSize = Math.floor(minEdgeSize * 0.75);
          return { width: qrboxSize, height: qrboxSize };
      }

      html5QrcodeScanner = new Html5QrcodeScanner("reader", {
        fps: 10,
        qrbox: qrboxFunction,
        videoConstraints: { facingMode: "environment" } // 強制後置鏡頭
      }, false);

      html5QrcodeScanner.render((decodedText) => {
        // 掃描成功處理
        $('itemInput').value = decodedText;

        // 清理掃描器
        html5QrcodeScanner.clear();
        readerDiv.style.display = 'none';
        scanBtn.innerHTML = '📷 掃描';
        scanBtn.classList.remove('scanning');

        // 播放簡單的提示音 (可選)
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = audioCtx.createOscillator();
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // A5 音符
          oscillator.connect(audioCtx.destination);
          oscillator.start();
          oscillator.stop(audioCtx.currentTime + 0.1);
        } catch(e) {}

        // 自動觸發查詢
        queryItem(decodedText);
      }, (error) => {
        // 忽略掃描失敗的警告，持續偵測
      });
    });

    // ── 查詢 API ────────────────────────────────────────────
    async function queryItem(itemId) {
      const statusBar = $('statusBar');
      const resultCard = $('resultCard');
      const loading = $('loading');
      const errorMsg = $('errorMsg');
      const welcome = $('welcome');

      // Reset UI
      welcome.style.display = 'none';
      statusBar.style.display = 'none';
      resultCard.style.display = 'none';
      errorMsg.style.display = 'none';
      loading.style.display = 'block';

      // 若有開啟掃描器，查詢時自動關閉
      if (html5QrcodeScanner && readerDiv.style.display === 'block') {
         html5QrcodeScanner.clear();
         readerDiv.style.display = 'none';
         scanBtn.innerHTML = '📷 掃描';
         scanBtn.classList.remove('scanning');
      }

      try {
        const data = await api('GET', `/api/logistics/${encodeURIComponent(itemId)}`);
        loading.style.display = 'none';

        // Status bar
        $('itemIdDisplay').textContent = `🔖 ${data.itemId}`;
        $('eventCount').textContent = `共 ${data.totalEvents} 筆紀錄`;

        const badge = $('statusBadge');
        if (data.currentStatus && data.currentStatus !== 'unknown') {
          badge.textContent = STATUS_LABELS[data.currentStatus] || data.currentStatus;
          badge.style.background = STATUS_COLORS[data.currentStatus] || '#999';
        } else {
          badge.textContent = '❓ 查無紀錄';
          badge.style.background = '#999';
        }
        statusBar.style.display = 'flex';
        resultCard.style.display = 'block';

        renderTimeline('timeline', data.transactions);
      } catch (err) {
        loading.style.display = 'none';
        errorMsg.style.display = 'block';
        errorMsg.className = 'card error-state';
        errorMsg.innerHTML = `❌ ${err.message}`;
      }
    }

    // ── 從 URL 取得 itemId (移至最底部，確保 DOM 與變數皆已就緒) ──
    const params = new URLSearchParams(location.search);
    const initialItemId = params.get('itemId');
    if (initialItemId) {
      $('itemInput').value = initialItemId;
      queryItem(initialItemId);
    }
  </script>
</body>
</html>
